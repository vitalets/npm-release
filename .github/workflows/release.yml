# Releases this GitHub Action itself; npm publishing is always skipped.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        required: true
        type: choice
        default: ''
        options:
          - ''
          - stable
          - next
      version:
        description: Version
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip-changelog-update:
        description: Skip changelog update and GitHub release
        required: false
        type: boolean
        default: false
      dry-run:
        description: Dry run
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm test

      - uses: ./
        with:
          channel:          ${{ inputs.channel }}
          version:          ${{ inputs.version }}
          skip-npm-publish: 'true'
          skip-changelog-update: ${{ inputs.skip-changelog-update }}
          dry-run:          ${{ inputs.dry-run }}
          github-token:     ${{ secrets.GITHUB_TOKEN }}

      - name: Update floating major tag
        if: ${{ inputs.dry-run == false && inputs.channel == 'stable' }}
        run: |
          VERSION=$(npm pkg get version | tr -d '"')
          MAJOR=${VERSION%%.*}
          git tag -f "v$MAJOR" "v$VERSION"
          git push origin "v$MAJOR" --force

# Runs the unit test suite on every push.
name: test

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run tsc
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify compiled CLI on Node 20
        run: |
          node dist/cli/index.js --help | grep -q 'Usage: npm-release'

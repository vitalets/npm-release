# Copy-paste example for consumers publishing an npm package with this action.
name: example release workflow

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        required: true
        type: choice
        default: '-'
        options:
          - '-'
          - stable
          - next
      version:
        description: Version
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip-npm-publish:
        description: Skip NPM publish
        required: false
        type: boolean
        default: false
      dry-run:
        description: Dry run
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # git commit, tag, push
      id-token: write  # OIDC trusted publishing to npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Required: writes .npmrc so OIDC token exchange works during npm publish
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Add your project-specific pre-publish checks here, for example:
      # - run: npm run lint
      # - run: npm run build
      # - run: npm test

      - uses: vitalets/npm-release@v2
        with:
          channel:          ${{ inputs.channel }}
          version:          ${{ inputs.version }}
          skip-npm-publish: ${{ inputs.skip-npm-publish }}
          dry-run:          ${{ inputs.dry-run }}
          github-token:     ${{ secrets.GITHUB_TOKEN }}

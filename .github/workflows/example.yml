# Copy-paste example for consumers publishing an npm package with this action.
name: example release workflow

on:
  workflow_dispatch:
    inputs:
      stable-release:
        description: Stable release (omit if releasing beta)
        required: false
        type: choice
        default: '-'
        options:
          - '-'
          - patch
          - minor
          - major
      beta-release:
        description: Beta release (omit if releasing stable)
        required: false
        type: choice
        default: '-'
        options:
          - '-'
          - beta-patch (start or continue)
          - beta-minor (start or continue)
          - beta-major (start or continue)
      skip-npm-publish:
        description: Skip NPM publish
        required: false
        type: boolean
        default: false
      dry-run:
        description: Dry run
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # git commit, tag, push
      id-token: write  # OIDC trusted publishing to npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Required: writes .npmrc so OIDC token exchange works during npm publish
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Add your project-specific pre-publish checks here, for example:
      # - run: npm run lint
      # - run: npm run build
      # - run: npm test

      - uses: vitalets/npm-release@v2
        with:
          stable-release:   ${{ inputs.stable-release }}
          beta-release:     ${{ inputs.beta-release }}
          skip-npm-publish: ${{ inputs.skip-npm-publish }}
          dry-run:          ${{ inputs.dry-run }}
          github-token:     ${{ secrets.GITHUB_TOKEN }}

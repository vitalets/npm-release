name: npm release
description: 'All-in-one npm release: bump version, update changelog, publish via OIDC trusted publishing, and create GitHub Release.'

branding:
  icon: 'package'
  color: 'green'

inputs:
  channel:
    description: Channel
    required: true
  version:
    description: Version
    required: true
  skip-npm-publish:
    description: Skip npm publish step
    required: false
    default: 'false'
  skip-changelog-update:
    description: Skip Changelog and GitHub release
    required: false
    default: 'false'
  dry-run:
    description: Dry run — no git push, no npm publish. Prints a summary instead.
    required: false
    default: 'false'
  github-token:
    description: GitHub token for git push and creating a GitHub Release (secrets.GITHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Bump version
      id: bump-version
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION_INCREMENT: ${{ inputs.version }}
      run: |
        CURRENT_VERSION=$(npm pkg get version | tr -d '"')
        echo "PREVIOUS_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
        VERSION_OPERATION=$(node "$GITHUB_ACTION_PATH/src/versioning.mts" "$CURRENT_VERSION" "$CHANNEL" "$VERSION_INCREMENT")
        if [[ "$CHANNEL" == "stable" ]]; then
          npm version "$VERSION_OPERATION" --no-git-tag-version
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          npm version "$VERSION_OPERATION" --no-git-tag-version --preid="$CHANNEL"
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi
        VERSION=$(npm pkg get version | tr -d '"')
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # Skipped for pre-releases: the [Unreleased] section keeps accumulating
    # changes so that the next stable release includes the full changelog.
    - name: Update changelog and extract release notes
      if: ${{ inputs.skip-changelog-update != 'true' && steps.bump-version.outputs.prerelease != 'true' }}
      id: update-changelog
      shell: bash
      run: |
        NOTES=$(node "$GITHUB_ACTION_PATH/src/changelog.mts" "${{ env.VERSION }}")
        echo "NOTES<<EOF" >> $GITHUB_ENV
        echo "$NOTES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Commit, tag, push
      id: commit-release
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      run: |
        git add package.json package-lock.json
        if [[ "$CHANGELOG_UPDATED" == 'true' ]]; then
          git add CHANGELOG.md
        fi
        git commit --no-verify -m "v${{ env.VERSION }}"
        git tag "v${{ env.VERSION }}"
        git push --no-verify origin HEAD --tags
      env:
        CHANGELOG_UPDATED: ${{ steps.update-changelog.outcome == 'success' }}
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Publish to npm
      id: publish-npm
      if: ${{ inputs.dry-run != 'true' && inputs.skip-npm-publish != 'true' }}
      shell: bash
      # --provenance attaches a signed build attestation via OIDC (requires id-token: write).
      # --tag sets the prerelease channel as the registry dist-tag.
      # Stable releases use the default 'latest' tag automatically.
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        if [[ "$CHANNEL" == "stable" ]]; then
          npm publish --provenance --access public
        else
          npm publish --provenance --access public --tag "$CHANNEL"
        fi

    # Skipped for pre-releases: GitHub Releases are only created for stable
    # versions to keep the release list clean.
    - name: Create GitHub Release
      id: create-github-release
      if: ${{ inputs.dry-run != 'true' && inputs.skip-changelog-update != 'true' && steps.bump-version.outputs.prerelease != 'true' }}
      shell: bash
      run: echo "$NOTES" | gh release create "v${{ env.VERSION }}" --title "v${{ env.VERSION }}" --notes-file -
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Release summary
      if: ${{ !cancelled() && (steps.commit-release.outcome == 'success' || (inputs.dry-run == 'true' && success())) }}
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        SKIP_NPM_PUBLISH: ${{ inputs.skip-npm-publish }}
        CHANGELOG_UPDATED: ${{ steps.update-changelog.outcome == 'success' }}
        GITHUB_RELEASE_OUTCOME: ${{ steps.create-github-release.outcome }}
        NPM_RELEASE_OUTCOME: ${{ steps.publish-npm.outcome }}
      run: |
        {
          if [[ "$DRY_RUN" == 'true' ]]; then
            printf '### Release summary (dry run)\n\n'
            printf '❗️ No changes pushed or published.\n\n'
          else
            printf '### Release summary\n\n'
          fi
          printf 'Old version: **%s**  \nNew version: **%s**\n\n' "$PREVIOUS_VERSION" "$VERSION"
          if [[ "$DRY_RUN" == 'true' && "$SKIP_NPM_PUBLISH" != 'true' ]]; then
            printf '%s\n' '- ✔️ NPM release would be created'
          elif [[ "$NPM_RELEASE_OUTCOME" == 'success' ]]; then
            printf '%s\n' '- ✅ NPM release created'
          elif [[ "$NPM_RELEASE_OUTCOME" == 'skipped' ]]; then
            printf '%s\n' '- ⏭️ NPM release skipped'
          fi
          if [[ "$DRY_RUN" == 'true' && "$CHANGELOG_UPDATED" == 'true' ]]; then
            printf '%s\n' '- ✔️ GitHub release would be created'
          elif [[ "$GITHUB_RELEASE_OUTCOME" == 'success' ]]; then
            printf '%s\n' '- ✅ GitHub release created'
          elif [[ "$GITHUB_RELEASE_OUTCOME" == 'skipped' ]]; then
            printf '%s\n' '- ⏭️ GitHub release skipped'
          fi
          printf '\n'
          if [[ "$DRY_RUN" == 'true' ]]; then
            if [[ "$CHANGELOG_UPDATED" == 'true' ]]; then
              printf '### Release notes\n\n%s\n\n' "$NOTES"
            fi
            printf '<details>\n<summary>Release files diff</summary>\n\n```diff\n'
            git diff --no-color -- package.json package-lock.json CHANGELOG.md
            printf '```\n\n</details>\n'
          else
            printf 'Update your local branch:\n\n'
            printf '```sh\ngit pull --rebase\n```\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

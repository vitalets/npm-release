# Stable operations use npm's SemVer behavior. A beta operation continues the
# current beta suffix when the selected beta line matches; otherwise it starts
# the selected beta line at beta.0. Operations lower than the current beta line
# are not permitted.
#
# Currently on stable version
# +-----------------+------------+------------------+
# | Current version | Action     | New version      |
# +-----------------+------------+------------------+
# | 1.2.3           | patch      | 1.2.4            |
# | 1.2.3           | minor      | 1.3.0            |
# | 1.2.3           | major      | 2.0.0            |
# | 1.2.3           | beta-patch | 1.2.4-beta.0     |
# | 1.2.3           | beta-minor | 1.3.0-beta.0     |
# | 1.2.3           | beta-major | 2.0.0-beta.0     |
# +-----------------+------------+------------------+
#
# Currently on beta patch
# +-----------------+------------+------------------+
# | Current version | Action     | New version      |
# +-----------------+------------+------------------+
# | 1.2.3-beta.0    | patch      | 1.2.3            |
# | 1.2.3-beta.0    | minor      | 1.3.0            |
# | 1.2.3-beta.0    | major      | 2.0.0            |
# | 1.2.3-beta.0    | beta-patch | 1.2.3-beta.1     |
# | 1.2.3-beta.0    | beta-minor | 1.3.0-beta.0     |
# | 1.2.3-beta.0    | beta-major | 2.0.0-beta.0     |
# +-----------------+------------+------------------+
#
# Currently on beta minor
# +-----------------+------------+------------------+
# | Current version | Action     | New version      |
# +-----------------+------------+------------------+
# | 1.2.0-beta.0    | patch      | Not permitted     |
# | 1.2.0-beta.0    | minor      | 1.2.0            |
# | 1.2.0-beta.0    | major      | 2.0.0            |
# | 1.2.0-beta.0    | beta-patch | Not permitted     |
# | 1.2.0-beta.0    | beta-minor | 1.2.0-beta.1     |
# | 1.2.0-beta.0    | beta-major | 2.0.0-beta.0     |
# +-----------------+------------+------------------+
#
# Currently on beta major
# +-----------------+------------+------------------+
# | Current version | Action     | New version      |
# +-----------------+------------+------------------+
# | 1.0.0-beta.0    | patch      | Not permitted     |
# | 1.0.0-beta.0    | minor      | Not permitted     |
# | 1.0.0-beta.0    | major      | 1.0.0            |
# | 1.0.0-beta.0    | beta-patch | Not permitted     |
# | 1.0.0-beta.0    | beta-minor | Not permitted     |
# | 1.0.0-beta.0    | beta-major | 1.0.0-beta.1     |
# +-----------------+------------+------------------+

name: npm release
description: 'All-in-one npm release: bump version, update changelog, publish via OIDC trusted publishing, and create GitHub Release.'

branding:
  icon: 'package'
  color: 'green'

inputs:
  stable-release:
    description: Stable release (keep 'none' if releasing beta)
    required: false
    default: 'none'
  beta-release:
    description: Beta release (keep 'none' if releasing stable)
    required: false
    default: 'none'
  skip-npm-publish:
    description: Skip npm publish step
    required: false
    default: 'false'
  dry-run:
    description: Dry run — no git push, no npm publish. Prints a summary instead.
    required: false
    default: 'false'
  github-token:
    description: GitHub token for git push and creating a GitHub Release (secrets.GITHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Bump version
      id: bump-version
      shell: bash
      env:
        STABLE_RELEASE: ${{ inputs.stable-release }}
        BETA_RELEASE: ${{ inputs.beta-release }}
      run: |
        CURRENT_VERSION=$(npm pkg get version | tr -d '"')
        VERSION_OPERATION=$(node "$GITHUB_ACTION_PATH/src/versioning.mts" "$CURRENT_VERSION" "$STABLE_RELEASE" "$BETA_RELEASE")
        npm version "$VERSION_OPERATION" --no-git-tag-version --preid=beta
        VERSION=$(npm pkg get version | tr -d '"')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        if [[ -z "$BETA_RELEASE" || "$BETA_RELEASE" == "none" ]]; then
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi

    # Skipped for pre-releases: the [Unreleased] section keeps accumulating
    # changes so that the next stable release includes the full changelog.
    - name: Update changelog and extract release notes
      if: ${{ steps.bump-version.outputs.prerelease != 'true' }}
      shell: bash
      run: |
        NOTES=$(node "$GITHUB_ACTION_PATH/src/changelog.mts" "${{ env.VERSION }}")
        echo "NOTES<<EOF" >> $GITHUB_ENV
        echo "$NOTES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Commit, tag, push
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      run: |
        git add package.json package-lock.json CHANGELOG.md
        git commit --no-verify -m "v${{ env.VERSION }}"
        git tag "v${{ env.VERSION }}"
        git push --no-verify origin HEAD --tags
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Publish to npm
      if: ${{ inputs.dry-run != 'true' && inputs.skip-npm-publish != 'true' }}
      shell: bash
      # --provenance attaches a signed build attestation via OIDC (requires id-token: write).
      # --tag sets the dist-tag on the registry (e.g. npm install pkg@next).
      # Stable releases use the default 'latest' tag automatically.
      run: npm publish --provenance --access public${{ steps.bump-version.outputs.prerelease == 'true' && ' --tag next' || '' }}

    # Skipped for pre-releases: GitHub Releases are only created for stable
    # versions to keep the release list clean.
    - name: Create GitHub Release
      if: ${{ inputs.dry-run != 'true' && steps.bump-version.outputs.prerelease != 'true' }}
      shell: bash
      run: echo "$NOTES" | gh release create "v${{ env.VERSION }}" --title "v${{ env.VERSION }}" --notes-file -
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Dry run summary
      if: ${{ inputs.dry-run == 'true' }}
      shell: bash
      run: |
        echo "=== Dry run - no changes pushed or published ==="
        echo "Version: ${{ env.VERSION }}"
        echo "--- Release notes ---"
        echo "$NOTES"
        echo "--- package.json version ---"
        npm pkg get version
        echo "--- Release files diff ---"
        git diff package.json package-lock.json CHANGELOG.md
